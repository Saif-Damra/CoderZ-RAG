<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoderZ — Courses assistant</title>

<!--
  Phase 7 — embeddable chat widget (CLAUDE.md §10).

  Single self-contained file: no framework, no build, no external assets.
  It talks to the FastAPI POST /chat endpoint (api/main.py) and shows the
  answer plus its source course name, RTL for Arabic and LTR for English,
  detected automatically per message.

  ── Embed it ────────────────────────────────────────────────────────────
  Easiest: host this file and drop an iframe on any page:

      <iframe src="https://YOUR-HOST/widget.html"
              style="position:fixed;inset:0;border:0;width:100%;height:100%;
                     pointer-events:none;z-index:2147483000"
              title="Courses assistant"></iframe>

  (the page behind stays clickable; only the launcher/panel capture clicks).
  Or copy the <style>, the .cz-widget markup and the <script> into your page.

  ── Point it at your API ────────────────────────────────────────────────
  Resolution order:
    1. window.CODERZ_CHAT_API  (set before this script runs)
    2. ?api=  query string on the widget URL
    3. the API_BASE default below
  Then add the host site's origin to CORS_ALLOW_ORIGINS in the API's .env.
-->

<style>
  .cz-widget {
    /* rebrand by editing these four lines */
    --cz-accent: #1f6feb;
    --cz-accent-text: #ffffff;
    --cz-radius: 16px;
    --cz-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               "Noto Sans Arabic", "Tahoma", "Helvetica Neue", Arial, sans-serif;

    --cz-bg: #ffffff;
    --cz-header-bg: var(--cz-accent);
    --cz-header-text: var(--cz-accent-text);
    --cz-bot-bg: #f1f3f5;
    --cz-bot-text: #1b1f24;
    --cz-user-bg: var(--cz-accent);
    --cz-user-text: var(--cz-accent-text);
    --cz-muted: #6b7280;
    --cz-border: #e5e7eb;
    --cz-shadow: 0 12px 40px rgba(0, 0, 0, .18);
    --cz-input-text: #1b1f24;

    position: fixed;
    inset: 0;
    pointer-events: none;           /* only children opt back in */
    z-index: 2147483000;
    font-family: var(--cz-font);
    font-size: 15px;
    line-height: 1.5;
  }
  .cz-widget *, .cz-widget *::before, .cz-widget *::after { box-sizing: border-box; }

  @media (prefers-color-scheme: dark) {
    .cz-widget {
      --cz-bg: #1c1f24;
      --cz-bot-bg: #2b2f36;
      --cz-bot-text: #e7e9ec;
      --cz-muted: #9aa3af;
      --cz-border: #363b43;
      --cz-shadow: 0 12px 40px rgba(0, 0, 0, .5);
      --cz-input-text: #e7e9ec;
    }
  }

  /* ── Launcher ─────────────────────────────────────────────── */
  .cz-launcher {
    pointer-events: auto;
    position: absolute;
    inset-block-end: 20px;
    inset-inline-end: 20px;
    width: 56px;
    height: 56px;
    border: 0;
    border-radius: 50%;
    background: var(--cz-accent);
    color: var(--cz-accent-text);
    box-shadow: var(--cz-shadow);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: transform .15s ease;
  }
  .cz-launcher:hover { transform: scale(1.05); }
  .cz-launcher:active { transform: scale(.97); }
  .cz-launcher svg { width: 26px; height: 26px; display: block; }
  .cz-launcher:focus-visible { outline: 3px solid var(--cz-accent); outline-offset: 3px; }

  /* ── Panel ────────────────────────────────────────────────── */
  .cz-panel {
    pointer-events: auto;
    position: absolute;
    inset-block-end: 88px;
    inset-inline-end: 20px;
    width: 380px;
    max-width: calc(100vw - 40px);
    height: 560px;
    max-height: calc(100dvh - 120px);
    background: var(--cz-bg);
    border: 1px solid var(--cz-border);
    border-radius: var(--cz-radius);
    box-shadow: var(--cz-shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform-origin: bottom right;
    opacity: 0;
    transform: translateY(12px) scale(.98);
    transition: opacity .16s ease, transform .16s ease;
  }
  .cz-panel[hidden] { display: none; }
  .cz-widget.cz-open .cz-panel { opacity: 1; transform: none; }

  .cz-header {
    flex: 0 0 auto;
    background: var(--cz-header-bg);
    color: var(--cz-header-text);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
  }
  .cz-header .cz-title { flex: 1 1 auto; }
  .cz-close {
    flex: 0 0 auto;
    background: transparent;
    border: 0;
    color: inherit;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 8px;
  }
  .cz-close:hover { background: rgba(255, 255, 255, .18); }
  .cz-close:focus-visible { outline: 2px solid var(--cz-accent-text); outline-offset: 1px; }

  .cz-log {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--cz-bg);
  }

  .cz-msg {
    max-width: 82%;
    padding: 9px 13px;
    border-radius: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .cz-msg.cz-bot {
    align-self: flex-start;
    background: var(--cz-bot-bg);
    color: var(--cz-bot-text);
    border-end-start-radius: 4px;
  }
  .cz-msg.cz-user {
    align-self: flex-end;
    background: var(--cz-user-bg);
    color: var(--cz-user-text);
    border-end-end-radius: 4px;
  }
  .cz-msg.cz-error {
    background: transparent;
    color: #b42318;
    border: 1px solid #f0b4ac;
  }
  @media (prefers-color-scheme: dark) {
    .cz-msg.cz-error { color: #ff9c8f; border-color: #7c3b34; }
  }

  .cz-src {
    align-self: flex-start;
    max-width: 82%;
    margin-block-start: -4px;
    font-size: 12.5px;
    color: var(--cz-muted);
  }
  .cz-src[dir="rtl"] { align-self: flex-end; text-align: right; }

  .cz-feedback {
    align-self: flex-start;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-block-start: -4px;
  }
  .cz-feedback[dir="rtl"] { align-self: flex-end; }
  .cz-fb-btn {
    border: 1px solid var(--cz-border);
    background: transparent;
    border-radius: 8px;
    padding: 2px 7px;
    font-size: 13px;
    line-height: 1.6;
    cursor: pointer;
    color: var(--cz-muted);
  }
  .cz-fb-btn:hover { background: var(--cz-bot-bg); }
  .cz-fb-btn.active { border-color: var(--cz-accent); color: var(--cz-accent); }
  .cz-fb-btn:disabled { cursor: default; opacity: .6; }
  .cz-fb-btn:focus-visible { outline: 2px solid var(--cz-accent); outline-offset: 1px; }
  .cz-fb-comment {
    flex: 1 1 auto;
    min-width: 0;
    max-width: 220px;
    border: 1px solid var(--cz-border);
    border-radius: 8px;
    padding: 3px 8px;
    font: inherit;
    font-size: 12.5px;
    color: var(--cz-input-text);
    background: var(--cz-bg);
  }
  .cz-fb-comment:focus-visible { outline: 2px solid var(--cz-accent); outline-offset: 0; }

  /* typing dots */
  .cz-typing { display: inline-flex; gap: 4px; align-items: center; }
  .cz-typing i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--cz-muted);
    animation: cz-bounce 1.2s infinite ease-in-out;
  }
  .cz-typing i:nth-child(2) { animation-delay: .18s; }
  .cz-typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes cz-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: .5; }
    40% { transform: translateY(-4px); opacity: 1; }
  }

  .cz-composer {
    flex: 0 0 auto;
    border-top: 1px solid var(--cz-border);
    padding: 10px;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    background: var(--cz-bg);
  }
  .cz-composer textarea {
    flex: 1 1 auto;
    resize: none;
    max-height: 120px;
    min-height: 40px;
    padding: 9px 12px;
    border: 1px solid var(--cz-border);
    border-radius: 12px;
    font: inherit;
    color: var(--cz-input-text);
    background: var(--cz-bg);
  }
  .cz-composer textarea:focus-visible { outline: 2px solid var(--cz-accent); outline-offset: 0; }
  .cz-send {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 12px;
    background: var(--cz-accent);
    color: var(--cz-accent-text);
    cursor: pointer;
    display: grid;
    place-items: center;
  }
  .cz-send svg { width: 20px; height: 20px; }
  .cz-send:disabled { opacity: .5; cursor: default; }
  .cz-send:focus-visible { outline: 3px solid var(--cz-accent); outline-offset: 2px; }

  @media (max-width: 480px) {
    .cz-panel {
      inset: auto 0 0 0;
      width: 100%;
      max-width: 100%;
      height: 88dvh;
      max-height: 88dvh;
      border-radius: var(--cz-radius) var(--cz-radius) 0 0;
    }
    .cz-launcher { inset-block-end: 16px; inset-inline-end: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cz-panel { transition: none; }
    .cz-launcher { transition: none; }
    .cz-typing i { animation: none; }
  }
</style>
</head>
<body>

<div class="cz-widget" id="czWidget">
  <button class="cz-launcher" id="czLauncher" type="button"
          aria-label="Open the courses assistant" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H8l-4 4V6a1 1 0 0 1 1-1Z"
            fill="currentColor"/>
    </svg>
  </button>

  <section class="cz-panel" id="czPanel" role="dialog" aria-label="Courses assistant" hidden>
    <header class="cz-header">
      <span class="cz-title">CoderZ — Courses assistant</span>
      <button class="cz-close" id="czClose" type="button" aria-label="Close">&times;</button>
    </header>

    <div class="cz-log" id="czLog" role="log" aria-live="polite"></div>

    <form class="cz-composer" id="czForm">
      <textarea id="czInput" rows="1" autocomplete="off"
                placeholder="Ask about our courses…"
                aria-label="Type your question"></textarea>
      <button class="cz-send" id="czSend" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 12l16-8-6 16-3-7-7-1Z" fill="currentColor"/>
        </svg>
      </button>
    </form>
  </section>
</div>

<script>
(function () {
  "use strict";

  // ── API base ──────────────────────────────────────────────
  // Default to this page's own origin: correct whenever the widget is
  // served by the same FastAPI app it talks to (e.g. the /widget mount in
  // api/main.py). Only a standalone/iframe embed on another site needs to
  // override this via window.CODERZ_CHAT_API or ?api=.
  var API_BASE = location.origin && location.origin !== "null"
    ? location.origin
    : "http://localhost:8000";
  try {
    var qs = new URLSearchParams(location.search).get("api");
    if (window.CODERZ_CHAT_API) API_BASE = String(window.CODERZ_CHAT_API);
    else if (qs) API_BASE = qs;
  } catch (e) { /* ignore */ }
  API_BASE = API_BASE.replace(/\/+$/, "");

  var REQUEST_TIMEOUT_MS = 45000;

  var COPY = {
    en: {
      title: "CoderZ — Courses assistant",
      launcherOpen: "Open the courses assistant",
      placeholder: "Ask about our courses…",
      greeting: "Hi! Ask me anything about our training courses.",
      source: "Source",
      listSep: ", ",
      errRephrase: "Please rephrase your question.",
      errGeneric: "Something went wrong. Please try again.",
      fbUp: "Helpful",
      fbDown: "Not helpful",
      fbCommentPlaceholder: "What went wrong? (optional)"
    },
    ar: {
      title: "CoderZ — مساعد الدورات",
      placeholder: "اسأل عن دوراتنا…",
      greeting: "مرحباً! اسألني أي شيء عن دوراتنا التدريبية.",
      source: "المصدر",
      listSep: "، ",
      errRephrase: "من فضلك أعد صياغة سؤالك.",
      errGeneric: "حدث خطأ ما. حاول مرة أخرى.",
      fbUp: "مفيدة",
      fbDown: "غير مفيدة",
      fbCommentPlaceholder: "ما الخطأ؟ (اختياري)"
    }
  };

  var widget = document.getElementById("czWidget");
  var launcher = document.getElementById("czLauncher");
  var panel = document.getElementById("czPanel");
  var closeBtn = document.getElementById("czClose");
  var log = document.getElementById("czLog");
  var form = document.getElementById("czForm");
  var input = document.getElementById("czInput");
  var sendBtn = document.getElementById("czSend");

  var busy = false;
  var greeted = false;

  // ── Direction detection ───────────────────────────────────
  var AR = /[؀-ۿݐ-ݿࢠ-ࣿﭐ-﷿ﹰ-﻿]/g;
  var LAT = /[A-Za-z]/g;
  function dirOf(str) {
    var a = (str.match(AR) || []).length;
    var l = (str.match(LAT) || []).length;
    return a > l ? "rtl" : "ltr";
  }
  function langOf(str) { return dirOf(str) === "rtl" ? "ar" : "en"; }

  function applyDir(d) {
    panel.dir = d;
    input.dir = d;
    var c = COPY[d === "rtl" ? "ar" : "en"];
    input.placeholder = c.placeholder;
  }
  // initial direction from the browser locale
  applyDir(/^ar\b/i.test(navigator.language || "") ? "rtl" : "ltr");

  // ── Rendering ─────────────────────────────────────────────
  function scrollDown() { log.scrollTop = log.scrollHeight; }

  function addMessage(role, text, opts) {
    opts = opts || {};
    var el = document.createElement("div");
    el.className = "cz-msg cz-" + role + (opts.error ? " cz-error" : "");
    el.dir = dirOf(text);
    el.textContent = text;
    log.appendChild(el);

    if (opts.sources && opts.sources.length) {
      var lang = opts.lang === "ar" ? "ar" : "en";
      var c = COPY[lang];
      var s = document.createElement("div");
      s.className = "cz-src";
      s.dir = lang === "ar" ? "rtl" : "ltr";
      s.textContent = c.source + ": " + opts.sources.join(c.listSep);
      log.appendChild(s);
    }
    scrollDown();
    return el;
  }

  function showTyping() {
    var el = document.createElement("div");
    el.className = "cz-msg cz-bot";
    el.dataset.typing = "1";
    var dots = document.createElement("span");
    dots.className = "cz-typing";
    dots.setAttribute("aria-label", "Assistant is typing");
    dots.appendChild(document.createElement("i"));
    dots.appendChild(document.createElement("i"));
    dots.appendChild(document.createElement("i"));
    el.appendChild(dots);
    log.appendChild(el);
    scrollDown();
    return el;
  }

  // ── Feedback (thumbs up/down + optional comment) ───────────
  function sendFeedback(interactionId, rating, comment) {
    fetch(API_BASE + "/feedback", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        interaction_id: interactionId,
        rating: rating,
        comment: comment || undefined
      })
    }).catch(function () { /* best-effort; nothing to show the user */ });
  }

  function addFeedbackUI(afterEl, interactionId, lang) {
    if (interactionId === null || interactionId === undefined) return;
    var dir = lang === "ar" ? "rtl" : "ltr";
    var c = COPY[lang === "ar" ? "ar" : "en"];

    var wrap = document.createElement("div");
    wrap.className = "cz-feedback";
    wrap.dir = dir;

    var up = document.createElement("button");
    var down = document.createElement("button");
    up.type = "button";
    down.type = "button";
    up.className = "cz-fb-btn";
    down.className = "cz-fb-btn";
    up.textContent = "👍"; // 👍
    down.textContent = "👎"; // 👎
    up.setAttribute("aria-label", c.fbUp);
    down.setAttribute("aria-label", c.fbDown);

    var sent = false;
    function lock(button) {
      sent = true;
      up.disabled = true;
      down.disabled = true;
      button.classList.add("active");
    }

    up.addEventListener("click", function () {
      if (sent) return;
      lock(up);
      sendFeedback(interactionId, "up", null);
    });
    down.addEventListener("click", function () {
      if (sent) return;
      lock(down);
      var box = document.createElement("input");
      box.type = "text";
      box.className = "cz-fb-comment";
      box.dir = dir;
      box.maxLength = 500;
      box.placeholder = c.fbCommentPlaceholder;
      var done = false;
      function submitComment() {
        if (done) return;
        done = true;
        sendFeedback(interactionId, "down", box.value.trim() || null);
        box.remove();
      }
      box.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); submitComment(); }
      });
      box.addEventListener("blur", submitComment);
      wrap.appendChild(box);
      box.focus();
    });

    wrap.appendChild(up);
    wrap.appendChild(down);
    afterEl.parentNode.insertBefore(wrap, afterEl.nextSibling);
    scrollDown();
  }

  // ── Networking ────────────────────────────────────────────
  function ask(question) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, REQUEST_TIMEOUT_MS);
    return fetch(API_BASE + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: question }),
      signal: ctrl.signal
    }).then(function (res) {
      clearTimeout(timer);
      return res.json().catch(function () { return {}; }).then(function (data) {
        return { status: res.status, ok: res.ok, data: data };
      });
    }).catch(function (err) {
      clearTimeout(timer);
      return { status: 0, ok: false, data: {}, networkError: true, err: err };
    });
  }

  function setBusy(v) {
    busy = v;
    input.disabled = v;
    sendBtn.disabled = v;
  }

  function submit() {
    if (busy) return;
    var q = input.value.trim();
    if (!q) return;

    applyDir(dirOf(q));
    addMessage("user", q);
    input.value = "";
    autoGrow();
    setBusy(true);
    var typingEl = showTyping();

    ask(q).then(function (r) {
      typingEl.remove();
      var fallbackLang = langOf(q);

      if (r.ok && r.data && typeof r.data.answer === "string") {
        var botLang = r.data.language || fallbackLang;
        addMessage("bot", r.data.answer, {
          sources: r.data.used_context ? (r.data.sources || []) : [],
          lang: botLang
        });
        addFeedbackUI(log.lastChild, r.data.interaction_id, botLang);
      } else {
        var c = COPY[fallbackLang];
        var msg = r.status === 422 ? c.errRephrase : c.errGeneric;
        addMessage("bot", msg, { error: true });
      }
    }).then(function () {
      setBusy(false);
      if (panelOpen()) input.focus();
    });
  }

  // ── Composer behaviour ────────────────────────────────────
  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  }
  input.addEventListener("input", autoGrow);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submit();
    }
  });
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    submit();
  });

  // ── Open / close ──────────────────────────────────────────
  function panelOpen() { return widget.classList.contains("cz-open"); }
  function openPanel() {
    panel.hidden = false;
    // allow the browser to apply `hidden=false` before transitioning
    requestAnimationFrame(function () {
      widget.classList.add("cz-open");
      launcher.setAttribute("aria-expanded", "true");
      if (!greeted) {
        greeted = true;
        var greetLang = panel.dir === "rtl" ? "ar" : "en";
        addMessage("bot", COPY[greetLang].greeting);
      }
      input.focus();
    });
  }
  function closePanel() {
    widget.classList.remove("cz-open");
    launcher.setAttribute("aria-expanded", "false");
    launcher.focus();
    setTimeout(function () { if (!panelOpen()) panel.hidden = true; }, 200);
  }
  launcher.addEventListener("click", function () {
    panelOpen() ? closePanel() : openPanel();
  });
  closeBtn.addEventListener("click", closePanel);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && panelOpen()) closePanel();
  });
})();
</script>
</body>
</html>
